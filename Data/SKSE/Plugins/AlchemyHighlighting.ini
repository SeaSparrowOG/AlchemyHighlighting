; Do not edit this INI directly. This plugin supports a "custom" INI to overwrite settings.
; The purpose of the default INI is for the author to more easily test/change things.
; Usave of the custom INI is intended for advanced users that want to safely modify settings.

; How to use the custom INI:
;	1. Copy this file.
;	2. Rename the copy to be the same, but with "_Custom" at the end.
;		For example, TestProject.ini becomes TestProject_Custom.ini 
;	3. Change any settings you want in the new file. This preservers compatibility with
;			future updates that may invalidate certain settings. 

[General]
; If set to 1, you will be able to see if an effect is weaker/stronger on an ingredient even if it is unknown.
bEnableForUnknownEffects = 0
; If set to 1, only weaker effects will be highlighted. If both bEnableOnlyForWeakerEffects and bEnableOnlyForStrongerEffects
; are enabled at the same time, no effects will be highlighted.
bEnableOnlyForWeakerEffects = 0
; If set to 1, only stronger effects will be highlighted. If both bEnableOnlyForWeakerEffects and bEnableOnlyForStrongerEffects
; are enabled at the same time, no effects will be highlighted.
bEnableOnlyForStrongerEffects = 0
; If set to 1, indicators/colors will only apply if the player has a specified perk.
bRequirePerk = 0
; The perk that will be required if bRequirePerk is 1.
sRequiredPerk = Skyrim.esm|0x58218

[SimpleIndicators]
; Simple indicators behave as text appended to the end of the effect. So "Resist Fire (+)".

; If set to 1, enables simple indicators, disabling color highlighting of effects.
bUseSimpleIndicators = 0
; If set to 1, simple indicators will use the colors defined in [Colors] for the indicator.
bSimpleIndicatorsUseColors = 0
; String to append to beneficial strong effects.
sStrongBeneficial = " (+)"
; String to append to harmful strong effects.
sStrongHarmful = " (+)"
; String to append to beneficial weak effects.
sWeakBeneficial = " (-)"
; String to append to harmful weak effects.
sWeakHarmful = " (-)"

[Colors]
; Color (in Hexadecimal RGB) used by beneficial weak effects.
iBeneficialWeak = 0xFF0000
; Color (in Hexadecimal RGB) used by harmful weak effects.
iHarmfullWeak = 0xFF0000
; Color (in Hexadecimal RGB) used by beneficial strong effects.
iBeneficialStrong = 0x00FF00
; Color (in Hexadecimal RGB) used by harmful strong effects.
iHarmfullStrong = 0x00FF00

[EnabledMenus]
; Indicators/Colors will appear in the Alchemy menu.
bEnableInAlchemy = 1
; Indicators/Colors will appear in the Inventory menu.
bEnableInInventory = 1
; Indicators/Colors will appear in the Container menu.
bEnableInContainer = 1
; Indicators/Colors will appear in the Barter menu.
bEnableInBarter = 1
; Indicators/Colors will appear in the Gift menu.
bEnableInGift = 1